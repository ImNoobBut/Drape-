<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drape Try-On</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="top">
        <div class="brand">
          <span class="mark"></span>
          <strong>Drape</strong>
        </div>
        <button id="close-btn" type="button" aria-label="Close">×</button>
      </header>

      <div class="stage">
        <video id="output" autoplay playsinline muted></video>
        <div id="status" class="status">Starting camera…</div>
        <div id="garment-preview" class="garment-preview" hidden>
          <img id="garment-thumb" alt="Selected garment" />
        </div>
      </div>

      <footer class="footer">
        <p id="hint">Drag a clothing image from the page onto this panel</p>
        <label class="upload">
          Upload garment
          <input id="file-input" type="file" accept="image/*" hidden />
        </label>
        <p class="build">v1.0.1</p>
      </footer>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
